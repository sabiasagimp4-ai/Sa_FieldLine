name: Check

# Windows も YMM4 も要らない検査をまとめて回します。
#   1. HLSL の構文（glslang）
#   2. C# の型検査（YMM4 はスタブ、Vortice は nuget の本物）
#   3. プロトタイプとの一致（GPU で作れる形に落とした実装が参照実装とずれていないか）
# 実ビルドは release.yml（windows-latest + fxc + 本物の YMM4）で行います。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install glslang
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: HLSL syntax
        run: sh tests/hlsl_syntax_check.sh

      - name: C# compile check
        run: sh tests/csharp_compile_check.sh Release

      - name: Install Python dependencies
        run: python -m pip install --upgrade numpy scipy

      - name: Pipeline regression
        run: python tests/gpu_pipeline_regression.py
